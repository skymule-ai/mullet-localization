# px4_ev_bridge. Shadow mode vs PX4 is PUBLISH_TO_PX4 in .env, not here.
/**:
  ros__parameters:
    px4_topic: /fmu/in/vehicle_visual_odometry
    # Pose of base_link (PX4's body frame, FLU here) in the running estimator's body frame (for
    # OpenVINS the D435i IMU, the "imu" child frame of odomimu). The lever arm is applied here, so
    # keep EKF2_EV_POS_X/Y/Z at 0.
    # mullet1 (2026-10-16): D435i facing forward, upright, centred left-right, its centre 0.165 m
    # ahead of and 0.055 m below the CoM (= Pixhawk, tape measure, ~1 cm). infra1 is 17.5 mm left
    # of the camera's centre, the IMU (optical axes: x right, y down, z forward) at
    # (-0.012, -0.006, +0.005) m FLU from infra1 (factory TF). So the IMU is at
    # (0.153, 0.0115, -0.050) m FLU from the CoM.
    body_t_base: [0.0115, -0.050, -0.153]
    body_q_base: [0.5, 0.5, -0.5, 0.5]  # w, x, y, z: base forward = IMU z, left = -x, up = -y
