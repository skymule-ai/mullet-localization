# FAST-LIO2 on mullet1's MID-360 (its internal IMU). Upstream config/mid360.yaml with the changes
# marked "mullet"; mullet-lio/docs/fast-lio.md explains each setting.
/**:
    ros__parameters:
        feature_extract_enable: false
        point_filter_num: 3
        max_iteration: 3
        filter_size_surf: 0.5
        filter_size_map: 0.5
        cube_side_length: 1000.0
        runtime_pos_log_enable: false
        map_file_path: "./test.pcd"

        common:
            lid_topic:  "/livox/lidar"   # livox_ros_driver2/msg/CustomMsg (xfer_format 1)
            imu_topic:  "/livox/imu"     # accelerations in g; FAST-LIO rescales them at init
            time_sync_en: false          # LiDAR and IMU share the MID-360's clock
            time_offset_lidar_to_imu: 0.0

        preprocess:
            lidar_type: 1                # Livox CustomMsg: real per-point times for deskew
            scan_line:  4
            blind: 0.5                   # m; raise it if the frame or props show up in the cloud
            timestamp_unit: 3
            scan_rate: 10

        mapping:
            acc_cov: 0.1
            gyr_cov: 0.1
            b_acc_cov: 0.0001
            b_gyr_cov: 0.0001
            fov_degree:    360.0
            det_range:     100.0
            extrinsic_est_en:  false     # mullet: factory IMU-to-LiDAR extrinsic, held fixed
            # LiDAR origin in the IMU frame (Livox factory values), m
            extrinsic_T: [ -0.011, -0.02329, 0.04412 ]
            extrinsic_R: [ 1., 0., 0.,
                            0., 1., 0.,
                            0., 0., 1.]

        publish:
            path_en: true
            effect_map_en: false
            map_en: false                # mullet: the whole map grows without bound; off on the Orin
            scan_publish_en:  true
            dense_publish_en: false
            scan_bodyframe_pub_en: true  # cloud_registered_body: deskewed scan, IMU frame

        pcd_save:
            pcd_save_en: false           # mullet: true keeps every scan in RAM until shutdown
            interval: -1
