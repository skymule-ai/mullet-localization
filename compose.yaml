# Localization on one drone. Pins the images built by mullet-drivers, mullet-vio and
# mullet-lio, holds this drone's sensor configs and calibration (config/), and adds the PX4
# bridge and recording. From here:
#   cp .env.example .env                # tags, COMPOSE_PROFILES (which stack); the ROS domain,
#                                       # DRONE_ID and LIVOX_IFACE come from /etc/mullet/drone.env
# Every topic is under the drone's namespace /$DRONE_ID (uav_N): sensors, estimators, the bridge, PX4
# (/uav_N/fmu/...) and the TF the estimators broadcast (/uav_N/tf). The fleet shares one ROS domain.
#   docker compose pull && docker compose up -d
#   docker compose run --rm record      # mcap bag into ~/flights/<UTC>_localization, Ctrl-C stops
#   docker compose run -d --rm --name loc-record record   # detached (survives SSH drops);
#   docker kill -s INT loc-record       # stops it and closes the bag
# config/ is mounted: edit it, then `docker compose restart <service>`. Never during a flight.
name: mullet-localization

x-ros: &ros
  network_mode: host
  ipc: host
  restart: unless-stopped
  # This drone's identity (ROS_DOMAIN_ID, LIVOX_IFACE, DRONE_ID, ...), written by mullet-setup and shared by
  # every Compose project on the Orin. Off the drone, point MULLET_DRONE_ENV at a copy.
  env_file:
    - path: ${MULLET_DRONE_ENV:-/etc/mullet/drone.env}
      required: true
  environment:
    RMW_IMPLEMENTATION: rmw_fastrtps_cpp
    # Same as mullet-core and the paddock. ponytail: images go through UDP loopback; enable
    # SHM for these containers if the copy shows up in the Orin's CPU budget.
    FASTDDS_BUILTIN_TRANSPORTS: UDPv4
    NVIDIA_VISIBLE_DEVICES: all
    NVIDIA_DRIVER_CAPABILITIES: compute,utility

services:
  # ── Sensors (mullet-drivers) ─────────────────────────────────────────────────
  realsense:  # /uav_N/d435i/{infra1,infra2}/image_rect_raw, /uav_N/d435i/imu
    <<: *ros
    profiles: [realsense, openvins]
    image: ghcr.io/skymule-ai/mullet-drivers-realsense:${DRIVERS_TAG:?set DRIVERS_TAG in .env}
    runtime: nvidia
    # Mounted, not mapped as a device: the D435i re-enumerates on reset.
    device_cgroup_rules:
      - "c 189:* rmw"  # USB devices
    volumes:
      - ./config/realsense:/config:ro
      - /dev/bus/usb:/dev/bus/usb
    # publish_tf false: the camera's internal static frames go nowhere else (OpenVINS has its own Kalibr
    # calibration), and the launch file can't move them off the fleet-wide /tf_static.
    command:
      - sh
      - -c
      - >-
        exec ros2 launch realsense2_camera rs_launch.py config_file:=/config/d435i.yaml
        camera_namespace:="$${DRONE_ID:?set DRONE_ID in /etc/mullet/drone.env}" camera_name:=d435i
        tf_prefix:="$$DRONE_ID/d435i" publish_tf:=false

  # /uav_N/livox/lidar (livox_ros_driver2/CustomMsg), /uav_N/livox/imu (acc in g). The image's own
  # command plus the namespace: __ns for relative names, the two remaps if the driver's are absolute.
  livox:
    <<: *ros
    profiles: [livox, fast-lio]
    image: ghcr.io/skymule-ai/mullet-drivers-livox:${DRIVERS_TAG:?set DRIVERS_TAG in .env}
    runtime: nvidia
    volumes:
      - ./config/livox:/config:ro
    command:
      - sh
      - -c
      - >-
        D=$${DRONE_ID:?set DRONE_ID in /etc/mullet/drone.env} &&
        exec ros2 run livox_ros_driver2 livox_ros_driver2_node --ros-args
        -p xfer_format:=0 -p multi_topic:=0 -p data_src:=0 -p publish_freq:=10.0 -p output_data_type:=0
        -p frame_id:=livox_frame -p user_config_path:=/config/MID360s_config.json
        -r __ns:=/$$D -r /livox/lidar:=/$$D/livox/lidar -r /livox/imu:=/$$D/livox/imu

  # gPTP master on the LiDAR's interface. Without it the driver stamps each packet on arrival (late,
  # jittered); with it, at measurement. Server only, no CAP_SYS_TIME: chrony owns the Orin clock.
  livox-ptp:
    <<: *ros
    profiles: [livox, fast-lio]
    image: ghcr.io/skymule-ai/mullet-drivers-livox:${DRIVERS_TAG:?set DRIVERS_TAG in .env}
    command: [sh, -c, 'exec ptp4l -i "$${LIVOX_IFACE:?set LIVOX_IFACE in /etc/mullet/drone.env}" -S -m -f /etc/linuxptp/livox-gptp.cfg']

  # ── Estimators (mullet-vio, mullet-lio) ──────────────────────────────────────
  # Both can run at once (COMPOSE_PROFILES=openvins,fast-lio) to compare them on the same flight;
  # the bridge forwards only ODOMETRY_TOPIC.
  # /uav_N/openvins/odomimu. The node subscribe.launch.py starts, with its params, run directly so its
  # TF (global -> imu -> cam*, fixed frame names) can be moved to /uav_N/tf. The Kalibr files name the
  # camera and IMU topics as /${DRONE_ID}/...: filled in from a copy of config/ at start.
  openvins:
    <<: *ros
    profiles: [openvins]
    image: ghcr.io/skymule-ai/mullet-vio-openvins:${VIO_TAG:?set VIO_TAG in .env}
    runtime: nvidia
    # Restarted with the camera driver: OpenVINS does not get images again when realsense is
    # recreated under it (mullet1, 2026-10-20: silent from a camera restart until its own restart).
    depends_on:
      realsense:
        condition: service_started
        restart: true
    volumes:
      - ./config/openvins:/config:ro
    command:
      - bash
      - -c
      - >-
        D=$${DRONE_ID:?set DRONE_ID in /etc/mullet/drone.env} &&
        mkdir -p /tmp/ov && cp /config/* /tmp/ov/ && sed -i "s#\$${DRONE_ID}#$$D#g" /tmp/ov/*.yaml &&
        exec ros2 run ov_msckf run_subscribe_msckf --ros-args -r __ns:=/$$D/openvins
        -p verbosity:=INFO -p use_stereo:=true -p max_cameras:=2 -p save_total_state:=false
        -p config_path:=/tmp/ov/estimator_config.yaml -r /tf:=/$$D/tf -r /tf_static:=/$$D/tf_static

  # /uav_N/fast_lio/odometry, its TF (camera_init -> body, fixed names) on /uav_N/tf.
  fast_lio:
    <<: *ros
    profiles: [fast-lio]
    image: ghcr.io/skymule-ai/mullet-lio-fast-lio:${LIO_TAG:?set LIO_TAG in .env}
    runtime: nvidia
    depends_on:  # restarted with the driver, like openvins
      livox:
        condition: service_started
        restart: true
    volumes:
      - ./config/fast-lio:/config:ro
    command:
      - sh
      - -c
      - >-
        D=$${DRONE_ID:?set DRONE_ID in /etc/mullet/drone.env} &&
        exec ros2 run fast_lio fastlio_mapping --ros-args --params-file /config/mid360.yaml
        -p common.lid_topic:=/$$D/livox/lidar -p common.imu_topic:=/$$D/livox/imu
        -r /Odometry:=/$$D/fast_lio/odometry -r /path:=/$$D/fast_lio/path
        -r /cloud_registered:=/$$D/fast_lio/cloud_registered
        -r /cloud_registered_body:=/$$D/fast_lio/cloud_registered_body
        -r /cloud_effected:=/$$D/fast_lio/cloud_effected -r /Laser_map:=/$$D/fast_lio/laser_map
        -r /tf:=/$$D/tf -r /tf_static:=/$$D/tf_static

  # ── PX4 bridge, recording, ground-station view ───────────────────────────────
  # Runs with whichever estimator is up; ODOMETRY_TOPIC names its output. Shadow mode unless
  # PUBLISH_TO_PX4=true.
  ev_bridge:
    <<: *ros
    profiles: [openvins, fast-lio]
    image: ghcr.io/skymule-ai/mullet-localization:${LOCALIZATION_TAG:?set LOCALIZATION_TAG in .env}
    volumes:
      - ./config:/config:ro
    command:
      - bash
      - -c
      - >-
        source /opt/mullet_ws/install/setup.bash &&
        D=$${DRONE_ID:?set DRONE_ID in /etc/mullet/drone.env} && O=${ODOMETRY_TOPIC:-openvins/odomimu} &&
        case $$O in /*) echo "ODOMETRY_TOPIC=$$O: relative, e.g. fast_lio/odometry (it is under /$$D)" >&2; exit 1;; esac &&
        exec ros2 run mullet_localization px4_ev_bridge --ros-args -r __ns:=/$$D
        --params-file /config/${EV_BRIDGE_CONFIG:-ev_bridge.yaml} -p publish_to_px4:=${PUBLISH_TO_PX4:-false}
        -p px4_topic:=/$$D/fmu/in/vehicle_visual_odometry -r localization/odometry:=$$O

  # Pre-recording check: clock, disk, UDP buffer, PX4 (alive, aligned, GPS), the estimators and the bridge.
  # Exit 0 only when all green: `docker compose run --rm preflight && docker compose run -d --rm --name
  # loc-record record`. Indoor-only: `docker compose run --rm preflight --no-gps`.
  preflight:
    <<: *ros
    profiles: [record]
    image: ghcr.io/skymule-ai/mullet-localization:${LOCALIZATION_TAG:?set LOCALIZATION_TAG in .env}
    restart: "no"
    volumes:
      - ./scripts/preflight.py:/preflight.py:ro
      - /run/systemd/timesync:/run/timesync:ro
      - ${HOME}/flights:/flights:ro
    entrypoint:
      - bash
      - -c
      - >-
        source /opt/mullet_ws/install/setup.bash &&
        PUBLISH_TO_PX4=${PUBLISH_TO_PX4:-false} COMPOSE_PROFILES=${COMPOSE_PROFILES:-}
        exec python3 /preflight.py "$$@"
      - preflight

  record:
    <<: *ros
    profiles: [record]
    image: ghcr.io/skymule-ai/mullet-localization:${LOCALIZATION_TAG:?set LOCALIZATION_TAG in .env}
    restart: "no"
    volumes:
      - ${HOME}/flights:/flights
    # Sensors, estimator outputs (not OpenVINS's debug images nor FAST-LIO's clouds: ~4x the bag
    # size, and the disk load dropped infra frames; raw /livox/* is enough to replay FAST-LIO), the bridge's message in shadow or fused mode, PX4's
    # estimate (local, global, which aiding sources it fuses), IMU and raw GPS: what the offline
    # evaluation replays every backend against, and this drone's TF. Only this drone's topics: anchored
    # to /$DRONE_ID, since the fleet shares the ROS domain.
    command:
      - bash
      - -c
      - >-
        source /opt/mullet_ws/install/setup.bash &&
        D=$${DRONE_ID:?set DRONE_ID in /etc/mullet/drone.env} &&
        exec ros2 bag record -s mcap -o /flights/$$(date -u +%Y%m%dT%H%M%SZ)_localization
        -e "^/$$D/(d435i/.*|openvins/(odomimu|poseimu)|fast_lio/(odometry|path)|livox/.*|localization/.*|fmu/in/vehicle_visual_odometry|fmu/out/(vehicle_odometry|vehicle_local_position_v1|vehicle_global_position|vehicle_gps_position|estimator_status_flags|sensor_combined)|tf|tf_static)\$$"

  # The key topics only (~280 MB/min instead of ~1.6 GB/min; the pattern is anchored: unanchored, it
  # also matched cloud_registered_body): both estimators, the bridge (shadow or
  # fused), PX4's estimate, raw GPS and IMU, FAST-LIO's registered scan (world frame, 0.5 m, viewable
  # as is) and the raw livox/lidar + livox/imu (~240 MB/min, estimated): enough to replay FAST-LIO and
  # to build the offline maps (pgo_map.py). No images, so it can't replay OpenVINS: use `record` for that.
  #   docker compose run -d --rm --name loc-record-lite record-lite ; docker kill -s INT loc-record-lite
  record-lite:
    <<: *ros
    profiles: [record]
    image: ghcr.io/skymule-ai/mullet-localization:${LOCALIZATION_TAG:?set LOCALIZATION_TAG in .env}
    restart: "no"
    volumes:
      - ${HOME}/flights:/flights
    command:
      - bash
      - -c
      - >-
        source /opt/mullet_ws/install/setup.bash &&
        D=$${DRONE_ID:?set DRONE_ID in /etc/mullet/drone.env} &&
        exec ros2 bag record -s mcap -o /flights/$$(date -u +%Y%m%dT%H%M%SZ)_lite
        -e "^/$$D/(livox/(lidar|imu)|fast_lio/(odometry|path|cloud_registered)|openvins/(odomimu|poseimu)|localization/vehicle_odometry|fmu/in/vehicle_visual_odometry|fmu/out/(vehicle_odometry|vehicle_local_position_v1|vehicle_global_position|vehicle_gps_position|estimator_status_flags|sensor_combined)|tf_static)\$$"

  foxglove:  # ws://<drone>:8765 for Lichtblick / Foxglove on the ground station
    <<: *ros
    profiles: [foxglove]
    image: ghcr.io/skymule-ai/mullet-drivers-viz:${DRIVERS_TAG:?set DRIVERS_TAG in .env}
    command: [ros2, launch, foxglove_bridge, foxglove_bridge_launch.xml, port:=8765]
