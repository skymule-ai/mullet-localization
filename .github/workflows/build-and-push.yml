name: Build and Push (ARM64)

# Push only: a pull_request trigger built every PR commit a second time, without pushing.
# The branch build already shows as the PR's check.
on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
    # Only what goes into the image (the Dockerfile copies mullet_localization/ only). Scripts, configs,
    # compose.yaml and docs are mounted or read on the drone: no rebuild. Tag pushes always build (GitHub
    # ignores paths for tags). A commit that skips the build gets no sha-<commit> image: pin
    # LOCALIZATION_TAG to the last commit that changed the image.
    paths:
      - "mullet_localization/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/build-and-push.yml"

jobs:
  build-and-push:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Always: the build copies the Livox messages from the driver image in GHCR.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/skymule-ai/mullet-localization
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
